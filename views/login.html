<!-- Plantillas SERMA. Edita el contenido entre las etiquetas de cada componente. -->
<template data-template="renderLogin-01.html"
  ><div class="login-wrap">
    <section class="brand-panel">
      <div>
        <img
          class="brand-mark"
          src="public/image/serma-icon-192.png?v=2"
          alt="Logo SERMA"
        />
        <h1>SERMA</h1>
        <p>
          Sistema centralizado para consultar y acompañar el progreso académico
          de la comunidad educativa Bruselas.
        </p>
      </div>
      <div class="brand-foot">
        Institución Educativa Departamental Bruselas · Ubaté
      </div>
    </section>
    <section class="login-side">
      <div class="login-card">
        <span class="badge">Acceso institucional</span>
        <h2 class="mobile-title">SERMA</h2>
        <h2>Bienvenido</h2>
        <p class="muted">Ingresa con la cuenta que te asignó la institución.</p>
        <form id="login">
          <div class="field">
            <label for="email">Correo</label
            ><input
              id="email"
              type="email"
              autocomplete="username"
              required
              maxlength="254"
            />
          </div>
          <div class="field">
            <label for="password">Contraseña</label
            ><input
              id="password"
              type="password"
              autocomplete="current-password"
              required
              maxlength="200"
            />
          </div>
          <div class="error">{{slot0}}</div>
          <button class="btn" type="submit">Iniciar sesión</button>
        </form>
        <p class="muted" style="font-size: 0.8rem; margin-top: 1rem">
          Si no tienes acceso, comunícate con rectoría. Las cuentas no se crean
          desde esta pantalla.
        </p>
      </div>
    </section>
  </div></template
>
