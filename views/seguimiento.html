<!-- Plantillas SERMA. Edita el contenido entre las etiquetas de cada componente. -->
<template data-template="progressPage-01.html"
  ><div class="welcome">
    <div>
      <h2>Avances y observaciones</h2>
      <p>
        El porcentaje corresponde a las etapas completadas del plan de estudios
        por estudiante.
      </p>
    </div>
    {{slot0}}<button class="btn secondary small" id="refresh-academic">
      Actualizar información
    </button>
  </div>
  <section class="panel">
    <div class="panel-head"><h3>Progreso por estudiante y materia</h3></div>
    <div class="filter-bar">
      <div class="field">
        <label>Buscar estudiante</label
        ><input
          type="search"
          data-student-filter
          placeholder="Nombre del estudiante"
        />
      </div>
      <div class="field">
        <label>Grado</label
        ><select data-grade-filter>
          <option value="">Todos</option>
          {{slot1}}
        </select>
      </div>
      <div class="field">
        <label>Materia</label
        ><select data-subject-filter>
          <option value="">Todas</option>
          {{slot2}}
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Estudiante</th>
            <th>Curso</th>
            <th>Materia</th>
            <th>Etapas completadas</th>
            <th>Avance checklist</th>
          </tr>
        </thead>
        <tbody>
          {{slot3}}
        </tbody>
      </table>
    </div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <h3>Historial de observaciones y actividades</h3>
    </div>
    {{slot4}}
  </section></template
>
